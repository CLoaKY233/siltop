[workspace]
resolver = "2"
members = [
    "crates/siltop-core",
    "crates/siltop-metrics",
    "crates/siltop-ui",
    "crates/siltop",
]
default-members = ["crates/siltop"]

[workspace.package]
version = "1.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/CLoaKY233/siltop"
rust-version = "1.98"

[workspace.dependencies]
siltop-core = { path = "crates/siltop-core" }
siltop-metrics = { path = "crates/siltop-metrics" }
siltop-ui = { path = "crates/siltop-ui" }
insta = "1.48"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
serde_json = "1"
thiserror = "2"
toml_edit = { version = "0.25", features = ["serde"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

# Shipped binaries: one codegen unit and thin LTO for speed, symbols
# stripped for size. `panic` stays `unwind` on purpose: the panic hook
# restores the terminal before the message prints.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
dbg_macro = "deny"
exit = "deny"
undocumented_unsafe_blocks = "deny"
large_enum_variant = "warn"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
