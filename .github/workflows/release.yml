name: Release

# Runs on version tags only (v1.2.0, v1.3.0-rc.1, ...). The full CI gate runs
# first; nothing is built or published unless it passes.
#
# Packaging is scripts/package.sh, so `scripts/package.sh` on a Mac is a dry
# run of the build job. The release (binaries, checksums, third-party notices)
# is published in this repository. Two steps are OPTIONAL and switch
# themselves on only when their secrets exist (docs/release.md has the setup):
#
#   codesign + notarize   APPLE_DEVELOPER_ID_P12 (base64 .p12 of the
#                         "Developer ID Application" cert + key),
#                         APPLE_DEVELOPER_ID_P12_PASSWORD, APPLE_DEVELOPER_ID
#                         (the identity, "Developer ID Application: NAME (TEAMID)").
#                         Notarization also needs an App Store Connect API key:
#                         APPLE_NOTARY_KEY (base64 .p8), APPLE_NOTARY_KEY_ID,
#                         APPLE_NOTARY_ISSUER.
#   Homebrew tap bump     HOMEBREW_TAP_TOKEN (fine-grained PAT, contents: write
#                         on the tap; vars.HOMEBREW_TAP_REPO overrides
#                         CLoaKY233/homebrew-tap). Final releases only.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Secrets are not allowed in `if:`; these booleans are.
      HAVE_CODESIGN: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' && secrets.APPLE_DEVELOPER_ID != '' }}
      HAVE_NOTARY: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' && secrets.APPLE_DEVELOPER_ID != '' && secrets.APPLE_NOTARY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: build
        run: cargo build --release --locked -p siltop
        env:
          SILTOP_GIT_SHA: ${{ github.sha }}

      - name: signing keychain (optional)
        if: env.HAVE_CODESIGN == 'true'
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/release.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$P12" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "${RUNNER_TEMP}/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "${RUNNER_TEMP}/cert.p12"
          echo "SILTOP_KEYCHAIN=${keychain}" >> "$GITHUB_ENV"
          if [ "$HAVE_NOTARY" = "true" ]; then
            printf '%s' "$NOTARY_KEY" | base64 --decode > "${RUNNER_TEMP}/notary.p8"
            xcrun notarytool store-credentials siltop-notary \
              --key "${RUNNER_TEMP}/notary.p8" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER" --keychain "$keychain"
            rm -f "${RUNNER_TEMP}/notary.p8"
            echo "SILTOP_NOTARY_PROFILE=siltop-notary" >> "$GITHUB_ENV"
          fi

      - name: package (codesign + notarize when configured)
        env:
          # Empty without the secret: package.sh then skips codesign.
          SILTOP_CODESIGN_IDENTITY: ${{ env.HAVE_CODESIGN == 'true' && secrets.APPLE_DEVELOPER_ID || '' }}
        run: scripts/package.sh "${GITHUB_REF_NAME}" --no-build --out dist

      - name: remove signing keychain
        if: always() && env.HAVE_CODESIGN == 'true'
        run: security delete-keychain "${RUNNER_TEMP}/release.keychain-db" || true

      - uses: actions/upload-artifact@v7
        with:
          name: siltop-${{ github.ref_name }}
          path: |
            dist/siltop-*.tar.gz*
            dist/siltop-*.zip*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      # homebrew runs only for a final release, and only when the tap token exists
      homebrew: ${{ steps.kind.outputs.prerelease == 'false' && env.HAVE_TAP == 'true' }}
    env:
      HAVE_TAP: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: release kind
        id: kind
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            *alpha*|*beta*|*rc*|v0.0.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          # This tag's CHANGELOG section (heading "## [X.Y.Z]") as the release notes.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "siltop ${GITHUB_REF_NAME}. See CHANGELOG.md." > "${RUNNER_TEMP}/notes.md"
          fi

      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.kind.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/siltop-*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no release assets" >&2
            exit 1
          fi
          extra=()
          if [ "$PRERELEASE" = "true" ]; then extra+=(--prerelease); else extra+=(--latest); fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --title "siltop ${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md" "${extra[@]}"
          fi


  # Bottle the release tarball, attach the bottle, push the formula, and check a clean
  # install pours it. See homebrew.yml (it also runs by hand as a dry run).
  homebrew:
    needs: publish
    if: needs.publish.outputs.homebrew == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
      publish: true
    secrets: inherit
